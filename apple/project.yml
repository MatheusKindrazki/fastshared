name: FastShared
options:
  bundleIdPrefix: dev.kindrazki.fastshared
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

# xcconfig files are attached at the project level via configFiles — the
# `settings.configs.<name>.xcconfig` YAML key is silently ignored by XcodeGen
# (it generates a build setting literally called `xcconfig` instead of setting
# baseConfigurationReference). Using configFiles writes the proper
# baseConfigurationReference for each XCBuildConfiguration so MARKETING_VERSION,
# DEVELOPMENT_TEAM, and API_BASE_URL actually propagate into builds.
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: 5.10
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    ENABLE_MODULE_VERIFIER: NO
    ALWAYS_SEARCH_USER_PATHS: NO

packages:
  FastSharedCore:
    path: Packages/FastSharedCore

targets:
  FastSharedApp:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FastSharedApp
    dependencies:
      - package: FastSharedCore
        product: FastSharedCore
    info:
      path: FastSharedApp/Info.plist
      properties:
        NSSupportsLiveActivities: true
        NSPhotoLibraryUsageDescription: "FastShared reads your most recent screenshot only when you ask — to upload it and give you a shareable link."
        # Export compliance: FastShared only uses standard HTTPS / system-
        # provided crypto. Declaring false here lets App Store Connect skip
        # the yearly export-compliance self-classification form. Flip back
        # to true if we ever ship password-protected links or E2E crypto.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # WHY: ground the launch surface in brand ink. A missing UILaunchScreen
        # produces a white default, which flashes on cold start and — more
        # importantly — bleeds at physical screen edges (rounded corners,
        # notch, home indicator) until the SwiftUI view mounts. The dark brand
        # color here matches `BrandPalette.ground` (#070318) so the transition
        # into the dark UI is seamless.
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_NAME: FastShared
        PRODUCT_BUNDLE_IDENTIFIER: dev.kindrazki.fastshared
        CODE_SIGN_ENTITLEMENTS: FastSharedApp/FastSharedApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Matheus Kindrazki. All rights reserved."
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    dependencies:
      - target: FastSharedShareExt
        embed: true
        codeSign: true
      - target: FastSharedLiveActivity
        embed: true
        codeSign: true
        destinationFilters: [iOS]
      - package: FastSharedCore
        product: FastSharedCore

  FastSharedShareExt:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FastSharedShareExt
    dependencies:
      - package: FastSharedCore
        product: FastSharedCore
    info:
      path: FastSharedShareExt/Info.plist
      properties:
        CFBundleDisplayName: FastShared
        CFBundlePackageType: XPC!
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsWebURLWithMaxCount: 0
              NSExtensionActivationSupportsText: false
    settings:
      base:
        PRODUCT_NAME: FastSharedShareExt
        PRODUCT_BUNDLE_IDENTIFIER: dev.kindrazki.fastshared.ShareExt
        CODE_SIGN_ENTITLEMENTS: FastSharedShareExt/FastSharedShareExt.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        TARGETED_DEVICE_FAMILY: "1,2"

  FastSharedLiveActivity:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: FastSharedLiveActivity
    dependencies:
      - package: FastSharedCore
        product: FastSharedCore
    info:
      path: FastSharedLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: FastShared Live Activity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: FastSharedLiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: dev.kindrazki.fastshared.LiveActivity
        CODE_SIGN_ENTITLEMENTS: FastSharedLiveActivity/FastSharedLiveActivity.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  FastSharedApp:
    build:
      targets:
        FastSharedApp: all
        FastSharedShareExt: all
        FastSharedLiveActivity: all
    run:
      config: Debug
      storeKitConfiguration: FastSharedApp/FastShared.storekit
    test:
      config: Debug
      storeKitConfiguration: FastSharedApp/FastShared.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  FastSharedShareExt:
    build:
      targets:
        FastSharedShareExt: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
