<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="FastShared app icon">
  <title>FastShared app icon</title>
  <defs>
    <linearGradient id="bg" x1="12%" y1="6%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#fbfcff"/>
      <stop offset="48%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#dfeaf2"/>
    </linearGradient>
    <linearGradient id="rail" x1="12%" y1="74%" x2="88%" y2="26%">
