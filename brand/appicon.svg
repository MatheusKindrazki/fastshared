<?xml version="1.0" encoding="UTF-8"?>
<!--
  FastShared · App Store icon · Plane + Arc (Refined) · 1024 × 1024
  Identical geometry to logo-mark, painted onto a dark surface tile so the
  mark reads on any home-screen wallpaper. Scaled from the 140-unit design
  canvas by 7.3143× so every hair-line matches the reference file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="FastShared app icon">
  <title>FastShared — Plane + Arc</title>
  <defs>
    <linearGradient id="fs-arc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#ff7ad1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9d7aff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c1a9ff"/>
    </linearGradient>
    <linearGradient id="fs-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a33"/>
      <stop offset="100%" stop-color="#070318"/>
    </linearGradient>
  </defs>

  <!-- Surface tile (iOS rounds the corners further; radius matches 32/140 · 1024 ≈ 234) -->
  <rect x="0" y="0" width="1024" height="1024" rx="234" ry="234" fill="url(#fs-canvas)"/>

  <!-- Arc — 9 · 7.3143 ≈ 66px stroke -->
  <path d="M 190 805 Q 439 717, 600 497"
        stroke="url(#fs-arc)" stroke-width="66" stroke-linecap="round" fill="none"/>

  <!-- Plane — translate(84,64)·7.3143 ≈ (614, 468); scale 1.1 · 7.3143 ≈ 8.05 -->
  <g transform="translate(614 468) scale(8.05)" fill="#fafaff">
    <path d="M 0 0 L 22 -26 L 14 10 L 4 4 L 0 18 L -4 4 Z"/>
    <path d="M 4 4 L 14 10" stroke="#fafaff" stroke-opacity="0.35" stroke-width="0.14"/>
  </g>
</svg>
