  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g opacity="0.42" fill="none" stroke="#d7e1e8" stroke-width="2">
    <path d="M164 276 H860"/>
    <path d="M164 748 H860"/>
    <path d="M276 164 V860"/>
    <path d="M748 164 V860"/>
  </g>

  <path d="M278 690 C390 392 552 648 746 336"
