  <g filter="url(#softShadow)">
    <rect x="174" y="510" width="312" height="242" rx="42" fill="url(#card)" stroke="#d7e1e8" stroke-width="8"/>
    <rect x="222" y="568" width="76" height="76" rx="18" fill="#00a69c"/>
    <path d="M243 617 l22 -22 18 18 11 -11 23 27" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M229 681 H414" stroke="#d7e1e8" stroke-width="18" stroke-linecap="round"/>
    <path d="M229 716 H360" stroke="#d7e1e8" stroke-width="18" stroke-linecap="round" opacity="0.74"/>
  </g>

