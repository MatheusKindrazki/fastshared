<?xml version="1.0" encoding="UTF-8"?>
<!--
  FastShared · horizontal lockup · mark + wordmark
  Mark (52 × 52) sits 14pt left of the wordmark "fastshared." set in
  Bricolage Grotesque bold, tracking -0.035em. Period glyph rendered in
  violet accent to echo the arc. The brand mark replaces the old timer-dot
  so the wordmark can stay clean at any size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" role="img" aria-label="FastShared">
  <title>FastShared</title>
  <defs>
    <linearGradient id="fs-arc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#ff7ad1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9d7aff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c1a9ff"/>
    </linearGradient>
  </defs>

  <!-- Mark scaled from 140-unit canvas to 52px: scale factor 52/140 ≈ 0.3714 -->
  <g transform="translate(0 6) scale(0.3714)">
    <path d="M 26 110 Q 60 98, 82 68"
          stroke="url(#fs-arc)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <g transform="translate(84 64) scale(1.1)" fill="currentColor">
      <path d="M 0 0 L 22 -26 L 14 10 L 4 4 L 0 18 L -4 4 Z"/>
      <path d="M 4 4 L 14 10" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
    </g>
  </g>

  <!-- Wordmark: Bricolage Grotesque 700, tracking -0.035em ≈ -1.12 at 32px -->
  <text x="66" y="44"
        font-family="'Bricolage Grotesque', system-ui, sans-serif"
        font-size="32" font-weight="700"
        letter-spacing="-1.12"
        fill="currentColor">fastshared<tspan fill="#9d7aff">.</tspan></text>
</svg>
