<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fastshared brand v2</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #070318;
        --violet: #9d7aff;
        --milk: #fffdf8;
        --line: rgba(255, 255, 255, 0.14);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "SF Pro Rounded", "SF Pro Display", Inter, system-ui, sans-serif;
        background: radial-gradient(circle at 52% 28%, rgba(157, 122, 255, 0.34), transparent 42%), var(--ink);
        color: var(--milk);
      }
      main {
        width: min(1120px, calc(100vw - 40px));
        margin: 0 auto;
        padding: 56px 0 72px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 56px;
        line-height: 0.92;
        letter-spacing: 0;
      }
      @media (min-width: 720px) {
        h1 { font-size: 92px; }
      }
      p {
        max-width: 680px;
        margin: 0 0 34px;
        color: rgba(255, 253, 248, 0.68);
        font-size: 18px;
        line-height: 1.55;
      }
      .hero {
        display: grid;
        gap: 34px;
      }
      .hero img {
        width: min(880px, 100%);
        height: auto;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-top: 42px;
      }
      .tile {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.045);
        padding: 18px;
      }
      .tile img {
        display: block;
        width: 100%;
        height: auto;
      }
      .tile.light {
        background: #fbf8f1;
      }
      .label {
        margin-top: 14px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--violet);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div>
          <h1>fastshared<span style="color: var(--violet)">.</span></h1>
          <p>
            Brand v2 uses the approved luminous paper-plane mark and violet
            flight arc. PNG assets are canonical; SVGs are fallbacks.
          </p>
        </div>
        <img src="./wordmark-horizontal-dark.png" alt="fastshared. lockup on dark background" />
      </section>

      <section class="grid" aria-label="Brand assets">
        <article class="tile">
          <img src="./appicon-1024.png" alt="App icon" />
          <div class="label">app icon</div>
        </article>
        <article class="tile">
          <img src="./logo-mark.png" alt="Transparent mark" />
          <div class="label">transparent mark</div>
        </article>
        <article class="tile">
          <img src="./logo-horizontal.png" alt="Transparent horizontal lockup" />
          <div class="label">horizontal</div>
        </article>
        <article class="tile light">
          <img src="./wordmark-horizontal-light.png" alt="Light background lockup" />
          <div class="label">light use</div>
        </article>
      </section>
    </main>
  </body>
</html>
