name: Setup Apple code signing
description: >
  Imports a persistent Apple Distribution certificate (.p12) into a temporary
  keychain and installs App Store provisioning profiles, so xcodebuild can sign
  with signingStyle=manual WITHOUT -allowProvisioningUpdates. This stops the CI
  from minting a throwaway Development certificate on every run (which exhausts
  the account's certificate limit).

inputs:
  certificate-p12-base64:
    description: Base64-encoded Apple Distribution .p12 export.
    required: true
  certificate-password:
    description: Password protecting the .p12.
    required: true
  provisioning-profiles-base64:
    description: >
      Base64-encoded tar.gz containing one or more .mobileprovision (iOS) and
      .provisionprofile (macOS) files for every target's bundle id.
    required: true
  keychain-password:
    description: Ephemeral password for the temporary keychain. Defaults to a fixed CI value.
    required: false
    default: fastshared-ci-keychain

runs:
  using: composite
  steps:
    - name: Import certificate and profiles
      shell: bash
      run: |
        set -euo pipefail

        CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
        PROFILES_TGZ="$RUNNER_TEMP/profiles.tar.gz"
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

        # Decode inputs.
        echo "${{ inputs.certificate-p12-base64 }}" | base64 -d > "$CERT_PATH"
        echo "${{ inputs.provisioning-profiles-base64 }}" | base64 -d > "$PROFILES_TGZ"

        # Create + unlock a throwaway keychain and make it the default search
        # list entry so xcodebuild finds the identity. set-keychain-settings -lut
        # keeps it unlocked for the whole job (21600s = 6h).
        security create-keychain -p "${{ inputs.keychain-password }}" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "${{ inputs.keychain-password }}" "$KEYCHAIN_PATH"

        # Import the distribution cert. -A would allow any app; we scope to
        # codesign/security/productbuild so only signing tools can use the key.
        security import "$CERT_PATH" \
          -P "${{ inputs.certificate-password }}" \
          -k "$KEYCHAIN_PATH" \
          -T /usr/bin/codesign \
          -T /usr/bin/security \
          -T /usr/bin/productbuild

        # Required on modern macOS so codesign can use the key non-interactively.
        security set-key-partition-list -S apple-tool:,apple: \
          -k "${{ inputs.keychain-password }}" "$KEYCHAIN_PATH" >/dev/null

        # Prepend our keychain to the search list (keep the login keychain too).
        security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)

        # Install provisioning profiles where Xcode looks for them. iOS uses
        # ~/Library/MobileDevice/Provisioning Profiles; modern Xcode also reads
        # the same dir for macOS .provisionprofile.
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        mkdir -p "$PROFILE_DIR"
        tar -xzf "$PROFILES_TGZ" -C "$RUNNER_TEMP"
        find "$RUNNER_TEMP" -maxdepth 2 \( -name '*.mobileprovision' -o -name '*.provisionprofile' \) -print0 |
          while IFS= read -r -d '' prof; do
            cp "$prof" "$PROFILE_DIR/"
            echo "installed profile: $(basename "$prof")"
          done

        echo "Signing identities available:"
        security find-identity -v -p codesigning "$KEYCHAIN_PATH"
