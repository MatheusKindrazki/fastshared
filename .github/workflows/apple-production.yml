name: Apple — Promote to Production

# Builds, signs, and uploads the FastShared app to TestFlight / App Store
# Connect for both iOS and macOS. Manual-only with a typed confirmation.
#
# Signing uses a PERSISTENT Apple Distribution certificate + provisioning
# profiles via the setup-apple-signing composite action (manual signing, no
# -allowProvisioningUpdates), so CI never mints throwaway certificates.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PROMOTE para confirmar"
        required: true
        type: string

concurrency:
  group: apple-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "PROMOTE" ]; then
            echo "::error::O campo 'confirm' deve ser exatamente PROMOTE"
            exit 1
          fi

  testflight:
    name: Build + Upload ${{ matrix.platform.name }} Production Build
    needs: guard
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: iOS
            destination: "generic/platform=iOS"
            archive: "FastShared-iOS.xcarchive"
            export_subdir: "ios"
            upload_platform: "ios"
          - name: macOS
            destination: "generic/platform=macOS"
            archive: "FastShared-macOS.xcarchive"
            export_subdir: "macos"
            upload_platform: "macos"
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Setup Apple code signing
        uses: ./.github/actions/setup-apple-signing
        with:
          certificate-p12-base64: ${{ secrets.BUILD_CERT_P12_B64 }}
          certificate-password: ${{ secrets.BUILD_CERT_PASSWORD }}
          provisioning-profiles-base64: ${{ secrets.PROVISIONING_PROFILES_B64 }}

      - name: Decode App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "${{ secrets.APPSTORE_CONNECT_API_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Archive ${{ matrix.platform.name }}
        working-directory: apple
        run: |
          xcodebuild archive \
            -scheme FastSharedApp \
            -project FastShared.xcodeproj \
            -destination '${{ matrix.platform.destination }}' \
            -configuration Release \
            -archivePath "build/${{ matrix.platform.archive }}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual
          test -d "build/${{ matrix.platform.archive }}" || (
            echo "::error::archive did not produce an xcarchive"; exit 1
          )

      - name: Export ${{ matrix.platform.name }}
        working-directory: apple
        run: |
          xcodebuild -exportArchive \
            -archivePath "build/${{ matrix.platform.archive }}" \
            -exportPath "build/${{ matrix.platform.export_subdir }}" \
            -exportOptionsPlist ExportOptions.plist
          ls -la "build/${{ matrix.platform.export_subdir }}"

      - name: Resolve upload artifact
        id: artifact
        working-directory: apple
        run: |
          file="$(find "build/${{ matrix.platform.export_subdir }}" -maxdepth 1 -type f \( -name '*.ipa' -o -name '*.pkg' \) -print -quit)"
          if [ -z "$file" ]; then
            echo "::error::No .ipa/.pkg artifact found in build/${{ matrix.platform.export_subdir }}"
            exit 1
          fi
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Prepare API key for altool
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/asc/AuthKey.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}.p8"

      - name: Upload to TestFlight
        working-directory: apple
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --platform "${{ matrix.platform.upload_platform }}" \
            --file "${{ steps.artifact.outputs.path }}" \
            --apiKey "$APPSTORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_API_KEY_ISSUER_ID"
