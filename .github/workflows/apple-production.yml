name: Apple — Promote to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PROMOTE para confirmar"
        required: true
        type: string

concurrency:
  group: apple-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "PROMOTE" ]; then
            echo "::error::O campo 'confirm' deve ser exatamente PROMOTE"
            exit 1
          fi

  testflight:
    name: Build + Upload Production Build
    needs: guard
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Archive iOS
        working-directory: apple
        run: |
          xcodebuild archive \
            -scheme FastSharedApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "build/FastShared-iOS.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | xcpretty || true
          test -d "build/FastShared-iOS.xcarchive" || (
            echo "::error::archive did not produce an xcarchive"; exit 1
          )

      - name: Export iOS
        working-directory: apple
        run: |
          xcodebuild -exportArchive \
            -archivePath "build/FastShared-iOS.xcarchive" \
            -exportPath "build/ipa" \
            -exportOptionsPlist ExportOptions.plist \
            | xcpretty || true
          ls -la "build/ipa"

      - name: Decode App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "${{ secrets.APPSTORE_CONNECT_API_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Upload to TestFlight
        working-directory: apple
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "build/ipa/FastShared.ipa" \
            --apiKey "$APPSTORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_API_KEY_ISSUER_ID" \
            --apiKeyPath "$RUNNER_TEMP/asc/AuthKey.p8"
