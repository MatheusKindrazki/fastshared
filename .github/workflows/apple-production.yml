name: apple-production

# Promotes the FastShared app to TestFlight / App Store Connect for both iOS
# and macOS via the fastlane `beta_all` lane. Manual-only (workflow_dispatch)
# with a typed confirmation to prevent accidental promotion. Uses the App Store
# Connect API key resolved by fastlane's app_store_connect_api_key.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PROMOTE para confirmar"
        required: true
        type: string

concurrency:
  group: apple-production
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event.inputs.confirm == 'PROMOTE' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Decode App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "${{ secrets.APPSTORE_CONNECT_API_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Build and upload to TestFlight (iOS + macOS)
        working-directory: apple
        run: |
          bundle install
          bundle exec fastlane beta_all build_number:${{ github.run_number }}
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ISSUER_ID }}
