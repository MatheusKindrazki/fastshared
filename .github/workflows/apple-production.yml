name: Apple — Promote to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PROMOTE para confirmar"
        required: true
        type: string

concurrency:
  group: apple-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "PROMOTE" ]; then
            echo "::error::O campo 'confirm' deve ser exatamente PROMOTE"
            exit 1
          fi

  testflight:
    name: Build + Upload ${{ matrix.platform.name }} Production Build
    needs: guard
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: iOS
            destination: "generic/platform=iOS"
            archive: "FastShared-iOS.xcarchive"
            export_subdir: "ios"
            upload_platform: "ios"
          - name: macOS
            destination: "generic/platform=macOS"
            archive: "FastShared-macOS.xcarchive"
            export_subdir: "macos"
            upload_platform: "macos"
    steps:
      - uses: actions/checkout@v4

      - name: Decode App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "${{ secrets.APPSTORE_CONNECT_API_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Archive ${{ matrix.platform.name }}
        working-directory: apple
        run: |
          xcodebuild archive \
            -scheme FastSharedApp \
            -project FastShared.xcodeproj \
            -destination '${{ matrix.platform.destination }}' \
            -configuration Release \
            -archivePath "build/${{ matrix.platform.archive }}" \
            CURRENT_PROJECT_VERSION=$(($(date +%s) - 1577836800)) \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_CONNECT_API_KEY_ISSUER_ID }}"
          test -d "build/${{ matrix.platform.archive }}" || (
            echo "::error::archive did not produce an xcarchive"; exit 1
          )

      - name: Export ${{ matrix.platform.name }}
        working-directory: apple
        run: |
          xcodebuild -exportArchive \
            -archivePath "build/${{ matrix.platform.archive }}" \
            -exportPath "build/${{ matrix.platform.export_subdir }}" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_CONNECT_API_KEY_ISSUER_ID }}"
          ls -la "build/${{ matrix.platform.export_subdir }}"

      - name: Resolve upload artifact
        id: artifact
        working-directory: apple
        run: |
          file="$(find "build/${{ matrix.platform.export_subdir }}" -maxdepth 1 -type f \( -name '*.ipa' -o -name '*.pkg' \) -print -quit)"
          if [ -z "$file" ]; then
            echo "::error::No .ipa/.pkg artifact found in build/${{ matrix.platform.export_subdir }}"
            exit 1
          fi
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Prepare API key for altool
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/asc/AuthKey.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}.p8"

      - name: Upload to TestFlight
        working-directory: apple
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --platform "${{ matrix.platform.upload_platform }}" \
            --file "${{ steps.artifact.outputs.path }}" \
            --apiKey "$APPSTORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_API_KEY_ISSUER_ID"
