name: apple-release

# Builds a signed archive of the FastShared app for both iOS and macOS and
# exports it with the committed ExportOptions.plist. The exported artifacts
# (.ipa / .pkg) are uploaded to the workflow run so a human can inspect
# entitlements and size before pushing to TestFlight.
#
# Signing uses a PERSISTENT Apple Distribution certificate + provisioning
# profiles seeded by the setup-apple-signing composite action (manual signing,
# no -allowProvisioningUpdates). This avoids minting a throwaway Development
# certificate on every CI run, which exhausts the account certificate limit.
# It does not upload to TestFlight; the production workflow owns that step.

on:
  push:
    tags:
      - 'apple-v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'CFBundleVersion override (defaults to GITHUB_RUN_NUMBER)'
        required: false
        default: ''

jobs:
  archive:
    strategy:
      # Keep each platform independent so a macOS-only tooling issue does not
      # block an iOS-only TestFlight push.
      fail-fast: false
      matrix:
        platform:
          - name: iOS
            destination: 'generic/platform=iOS'
            archive: FastShared-iOS.xcarchive
            export_subdir: ipa
          - name: macOS
            destination: 'generic/platform=macOS'
            archive: FastShared-macOS.xcarchive
            export_subdir: app
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Setup Apple code signing
        uses: ./.github/actions/setup-apple-signing
        with:
          certificate-p12-base64: ${{ secrets.BUILD_CERT_P12_B64 }}
          certificate-password: ${{ secrets.BUILD_CERT_PASSWORD }}
          provisioning-profiles-base64: ${{ secrets.PROVISIONING_PROFILES_B64 }}

      - name: Decode App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "${{ secrets.APPSTORE_CONNECT_API_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Resolve build number
        id: build_number
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            echo "value=${{ github.event.inputs.build_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive ${{ matrix.platform.name }}
        working-directory: apple
        run: |
          xcodebuild archive \
            -scheme FastSharedApp \
            -project FastShared.xcodeproj \
            -destination '${{ matrix.platform.destination }}' \
            -configuration Release \
            -archivePath "build/${{ matrix.platform.archive }}" \
            CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.value }} \
            CODE_SIGN_STYLE=Manual
          test -d "build/${{ matrix.platform.archive }}" || (
            echo "::error::archive did not produce an xcarchive"; exit 1
          )

      - name: Export ${{ matrix.platform.name }}
        working-directory: apple
        run: |
          xcodebuild -exportArchive \
            -archivePath "build/${{ matrix.platform.archive }}" \
            -exportPath "build/${{ matrix.platform.export_subdir }}" \
            -exportOptionsPlist ExportOptions.plist
          ls -la "build/${{ matrix.platform.export_subdir }}"

      - name: Upload archive + export
        uses: actions/upload-artifact@v4
        with:
          name: fastshared-${{ matrix.platform.name }}-${{ steps.build_number.outputs.value }}
          path: |
            apple/build/${{ matrix.platform.archive }}
            apple/build/${{ matrix.platform.export_subdir }}
          retention-days: 14
          if-no-files-found: warn
