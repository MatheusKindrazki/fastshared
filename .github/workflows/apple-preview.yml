name: Apple — Preview (TestFlight)

on:
  push:
    branches: [main]
    paths:
      - "apple/**"
      - ".github/workflows/apple-preview.yml"

concurrency:
  group: apple-preview
  cancel-in-progress: false

jobs:
  testflight:
    name: Build + Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check project exists
        working-directory: apple
        run: |
          pwd
          ls -la
          ls -la FastShared.xcodeproj/

      - name: Archive iOS
        working-directory: apple
        run: |
          xcodebuild archive \
            -scheme FastSharedApp \
            -project FastShared.xcodeproj \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "build/FastShared-iOS.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
          test -d "build/FastShared-iOS.xcarchive" || (
            echo "::error::archive did not produce an xcarchive"; exit 1
          )

      - name: Export iOS
        working-directory: apple
        run: |
          xcodebuild -exportArchive \
            -archivePath "build/FastShared-iOS.xcarchive" \
            -exportPath "build/ipa" \
            -exportOptionsPlist ExportOptions.plist \
            | xcpretty || true
          ls -la "build/ipa"

      - name: Decode App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "${{ secrets.APPSTORE_CONNECT_API_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Upload to TestFlight
        working-directory: apple
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "build/ipa/FastShared.ipa" \
            --apiKey "$APPSTORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_API_KEY_ISSUER_ID" \
            --apiKeyPath "$RUNNER_TEMP/asc/AuthKey.p8"
