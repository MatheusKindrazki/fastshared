name: Apple — Preview (TestFlight)

on:
  push:
    branches: [main]
    paths:
      - "apple/**"
      - ".github/workflows/apple-preview.yml"

concurrency:
  group: apple-preview
  cancel-in-progress: false

jobs:
  testflight:
    name: Build + Upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler: "latest"

      - name: Decode App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "${{ secrets.APPSTORE_CONNECT_API_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Install and update gems
        working-directory: apple
        run: |
          bundle update

      - name: Build and upload to TestFlight
        working-directory: apple
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ISSUER_ID }}
          APPSTORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          FASTSHARED_CHANGELOG: "Preview build from ${{ github.sha }}"
        run: bundle exec fastlane ios beta
