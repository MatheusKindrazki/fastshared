<?xml version="1.0" encoding="UTF-8"?>
<!--
  FastShared · mark · Plane + Arc (Refined)
  Geometry from design/plane-arc.jsx PA_Refined, frame stripped so the glyph
  can sit on any background. Violet accent is the canonical brand tone; swap
  the gradient stops to recolour.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="FastShared">
  <title>FastShared</title>
  <defs>
    <linearGradient id="fs-arc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#ff7ad1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9d7aff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c1a9ff"/>
    </linearGradient>
  </defs>
  <!-- Arc — single brush stroke, fade → hot → soft -->
  <path d="M 26 110 Q 60 98, 80 72"
        stroke="url(#fs-arc)" stroke-width="9" stroke-linecap="butt" fill="none"/>
  <!-- Plane — tucked into the arc terminus -->
  <g transform="translate(81 66) scale(1.1)" fill="#1d1d1f">
    <path d="M 0 0 L 22 -26 L 14 10 L 4 4 L 0 18 L -8 4 Z"/>
    <path d="M 4 4 L 14 10" stroke="#1d1d1f" stroke-opacity="0.35" stroke-width="1"/>
  </g>
</svg>
