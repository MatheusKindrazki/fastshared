# R2 lifecycle safety net: configure a bucket-level expiration rule
# out-of-band (dashboard or `wrangler r2 bucket lifecycle`). The app-level
# deletion_job cron is authoritative; the bucket rule is only there to reap
# anything the app somehow never got around to (e.g. if the scheduler is paused
# for days). Suggested rule: delete objects 90 days after creation.

name = "fastshared-api"
main = "src/index.ts"
compatibility_date = "2026-04-19"
compatibility_flags = ["nodejs_compat"]
account_id = "aad020260082c48f6370fa7954b72f81"

# Secrets (set with: wrangler secret put <NAME>):
#   DATABASE_URL, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, DEVICE_TOKEN_PEPPER,
#   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_P8_KEY_BASE64
# (APPLE_BUNDLE_ID is a public var — see [vars] below.)

# Production custom domains. Apex serves short-link redirects at /s/:token
# AND /.well-known/apple-app-site-association for universal links; api serves
# the /v1/* surface. See docs/architecture/system-design.md.
[[routes]]
pattern = "fastsha.red"
custom_domain = true

[[routes]]
pattern = "api.fastsha.red"
custom_domain = true

[[r2_buckets]]
binding = "R2"
bucket_name = "fastshared"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "6fba7370dd774b42b4ac36d00ec90238"

[triggers]
crons = ["*/1 * * * *", "0 * * * *", "0 3 * * 7"]

[vars]
APP_ENV = "production"
SHORT_LINK_HOST = "https://fastsha.red"
PUBLIC_API_HOST = "https://api.fastsha.red"
R2_BUCKET_NAME = "fastshared"
R2_ACCOUNT_ID = "aad020260082c48f6370fa7954b72f81"
# Public — matches apple/Config/Shared.xcconfig PRODUCT_BUNDLE_IDENTIFIER_PREFIX.
# Apple's "Sign in with Apple" JWT puts this in the aud claim; must be identical
# to the iOS/macOS app's bundle identifier, otherwise verifyIdentityToken() 401s.
APPLE_BUNDLE_ID = "dev.kindrazki.fastshared"
# Comma-separated Apple User IDs ("sub" claim) that should always resolve as
# Pro/lifetime. Use for the founder / internal testers who need the full
# feature set without a real StoreKit transaction. Not a credential — just an
# opaque Apple identifier — but keep the list short.
DEV_PRO_APPLE_USER_IDS = "001657.9b2eb6771024436bb449edaf4b024c3a.1305"

# --- Staging environment ------------------------------------------------------
# Deploy with: wrangler deploy --env staging
# Uses the default workers.dev subdomain (no custom domain needed).
# KV and R2 bindings are shared with production for simplicity; in a
# multi-tenant setup you would create separate namespaces/buckets.
[env.staging]
name = "fastshared-api-stg"

[[env.staging.routes]]
pattern = "fastshared-api-stg.kindrazki.workers.dev"
custom_domain = false

[[env.staging.r2_buckets]]
binding = "R2"
bucket_name = "fastshared"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT"
id = "6fba7370dd774b42b4ac36d00ec90238"

[env.staging.vars]
APP_ENV = "staging"
SHORT_LINK_HOST = "https://fastshared-api-stg.kindrazki.workers.dev"
PUBLIC_API_HOST = "https://fastshared-api-stg.kindrazki.workers.dev"
R2_BUCKET_NAME = "fastshared"
R2_ACCOUNT_ID = "aad020260082c48f6370fa7954b72f81"
APPLE_BUNDLE_ID = "dev.kindrazki.fastshared"
DEV_PRO_APPLE_USER_IDS = "001657.9b2eb6771024436bb449edaf4b024c3a.1305"
