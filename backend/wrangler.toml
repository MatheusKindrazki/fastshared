# R2 lifecycle safety net: configure a bucket-level expiration rule
# out-of-band (dashboard or `wrangler r2 bucket lifecycle`). The app-level
# deletion_job cron is authoritative; the bucket rule is only there to reap
# anything the app somehow never got around to (e.g. if the scheduler is paused
# for days). Suggested rule: delete objects 90 days after creation.

name = "fastshared-api"
main = "src/index.ts"
compatibility_date = "2026-04-19"
compatibility_flags = ["nodejs_compat"]
account_id = "aad020260082c48f6370fa7954b72f81"

# Secrets (set with: wrangler secret put <NAME>):
#   DATABASE_URL, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, DEVICE_TOKEN_PEPPER

# Production custom domains. Apex serves short-link redirects at /s/:token;
# api serves the /v1/* surface. See docs/architecture/system-design.md.
#
# fsh.re is the legacy short-link host — bound to the same worker so it
# serves /s/:token AND /.well-known/apple-app-site-association (the AASA
# file ships identical bytes on both hosts so iOS can take over link
# resolution for either hostname after install).
[[routes]]
pattern = "fastsha.red"
custom_domain = true

[[routes]]
pattern = "api.fastsha.red"
custom_domain = true

[[routes]]
pattern = "fsh.re"
custom_domain = true

[[r2_buckets]]
binding = "R2"
bucket_name = "fastshared"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "6fba7370dd774b42b4ac36d00ec90238"

[triggers]
crons = ["*/1 * * * *", "0 * * * *", "0 3 * * 7"]

[vars]
APP_ENV = "production"
SHORT_LINK_HOST = "https://fastsha.red"
PUBLIC_API_HOST = "https://api.fastsha.red"
R2_BUCKET_NAME = "fastshared"
R2_ACCOUNT_ID = "aad020260082c48f6370fa7954b72f81"
