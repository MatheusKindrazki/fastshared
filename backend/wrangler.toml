# R2 lifecycle safety net: configure a bucket-level expiration rule
# out-of-band (dashboard or `wrangler r2 bucket lifecycle`). The app-level
# deletion_job cron is authoritative; the bucket rule is only there to reap
# anything the app somehow never got around to (e.g. if the scheduler is paused
# for days). Suggested rule: delete objects 90 days after creation. This file
# does NOT configure it — Workers config has no R2 lifecycle knob.

name = "fastshared-api"
main = "src/index.ts"
compatibility_date = "2026-04-19"
compatibility_flags = ["nodejs_compat"]

# Secrets (set with: wrangler secret put <NAME>)
# wrangler secret put DATABASE_URL
# wrangler secret put R2_ACCESS_KEY_ID
# wrangler secret put R2_SECRET_ACCESS_KEY
# wrangler secret put DEVICE_TOKEN_PEPPER

[[r2_buckets]]
binding = "R2"
bucket_name = "fastshared-prod"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_ME_KV_ID"

[triggers]
crons = ["*/1 * * * *", "0 * * * *", "0 3 * * 0"]

[vars]
APP_ENV = "dev"
SHORT_LINK_HOST = "https://fsh.dev"
PUBLIC_API_HOST = "https://api.dev.fastshared.app"
R2_BUCKET_NAME = "fastshared-prod"
R2_ACCOUNT_ID = "REPLACE_ME"

[env.production]
name = "fastshared-api-prod"

[env.production.vars]
APP_ENV = "production"
SHORT_LINK_HOST = "https://fsh.re"
PUBLIC_API_HOST = "https://api.fastshared.app"
R2_BUCKET_NAME = "fastshared-prod"
R2_ACCOUNT_ID = "REPLACE_ME"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "fastshared-prod"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_ME_PROD_KV_ID"

[env.production.triggers]
crons = ["*/1 * * * *", "0 * * * *", "0 3 * * 0"]
